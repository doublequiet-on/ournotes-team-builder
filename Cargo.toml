[package]
name = "ournotes-team-builder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Team-building engine of Haneoka (https://haneoka.org)"
repository = "https://github.com/haneoka-gakuen/ournotes-team-builder"

[lib]
name = "haneoka_team_engine"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rustc-hash = "2.1"

[profile.release]
lto = "thin"
codegen-units = 1
