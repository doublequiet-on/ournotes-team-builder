name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Native and WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy --locked --lib -- -D warnings
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --release --locked
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown
